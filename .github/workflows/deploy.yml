name: Deploy

on:
  push:
    branches:
      - main

env:
  DEPLOY_PATH: /root/telegram-test-collector

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 178.105.197.91
          username: root
          port: 22
          key: ${{ secrets.ACTIONS_KEY_JVSERVER }}
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            git pull origin main
            docker compose up -d --build
            docker image prune -f
