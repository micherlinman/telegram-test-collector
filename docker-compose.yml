services:
  app:
    build: .
    container_name: telegram-collector
    env_file: .env
    environment:
      TELEGRAM_SESSION: /data/collector
      MESSAGE_LOG_FILE: /data/messages.jsonl
      TEXT_LOG_FILE: /data/messages.log
      MEDIA_DIR: /data/media
    volumes:
      - ./data:/data
    # Kein Host-Port: erreichbar nur über Caddy (jstack-core) unter telegram.jcluster.de
    expose:
      - "8000"
    networks:
      - edge
    restart: unless-stopped
    stdin_open: true
    tty: true

networks:
  edge:
    name: jcluster-edge
    external: true
