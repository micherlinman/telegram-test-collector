services:
  app:
    build: .
    env_file: .env
    environment:
      TELEGRAM_SESSION: /data/collector
      MESSAGE_LOG_FILE: /data/messages.jsonl
      TEXT_LOG_FILE: /data/messages.log
      MEDIA_DIR: /data/media
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    stdin_open: true
    tty: true
